<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Download PDF</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#0f172a,#1e3a8a,#7c3aed,#0f172a);
background-size:400% 400%;
animation:bg 10s ease infinite;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
width:90%;
max-width:450px;
padding:40px;
text-align:center;
border-radius:25px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);
box-shadow:0 0 40px rgba(255,255,255,.2);
animation:entrada 1s ease;
}

@keyframes entrada{
from{
opacity:0;
transform:translateY(50px);
}
to{
opacity:1;
transform:translateY(0);
}
}

h1{
color:white;
font-size:2rem;
margin-bottom:15px;
}

p{
color:#ddd;
margin-bottom:30px;
}

.btn{
display:inline-block;
padding:15px 35px;
text-decoration:none;
font-weight:bold;
color:white;
border-radius:50px;
background:linear-gradient(90deg,#3b82f6,#8b5cf6);
transition:.3s;
box-shadow:0 0 25px #3b82f6;
}

.btn:hover{
transform:scale(1.08);
box-shadow:0 0 40px #8b5cf6;
}

.versao{
margin-top:15px;
color:#dbeafe;
font-size:14px;
font-weight:bold;
letter-spacing:1px;
text-transform:uppercase;
}
</style>
</head>
<body>

<div class="card">
<h1>📄 Download do PDF</h1>

<p>
Clique no botão abaixo para baixar o arquivo.
</p>

<a href="arquivo.pdf" download class="btn">
📥 BAIXAR PDF
</a>

<p class="versao">
V2 CORRIGIDA E ATUALIZADA
</p>

</div>

</body>
</html>
